name: Update official-images

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-official-images
  cancel-in-progress: false

env:
  # Change to 'false' only when ready to create or update the upstream PR.
  DRY_RUN: 'true'

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Maven images
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          path: maven
          persist-credentials: false

      - name: Check out official-images
        uses: actions/checkout@v7
        with:
          repository: docker-library/official-images
          ref: master
          path: official-images
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: Install publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y moreutils
          go install github.com/docker-library/bashbrew/cmd/bashbrew@v0.1.14
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate and validate official-images metadata
        id: publish
        working-directory: maven
        run: ./update-official-images.sh "$GITHUB_WORKSPACE/official-images" "$RUNNER_TEMP/official-images-report"

      - name: Upload dry-run report
        if: always() && steps.publish.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: official-images-report
          path: ${{ runner.temp }}/official-images-report/

      - name: Create or update official-images PR
        if: steps.publish.outcome == 'success' && steps.publish.outputs.changed == 'true' && env.DRY_RUN == 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          path: official-images
          base: master
          push-to-fork: carlossg/official-images
          branch: update-maven
          add-paths: library/maven
          commit-message: "chore: update maven"
          title: "Update maven"
          body: |
            Update the Maven official images metadata from carlossg/docker-maven.
